[project]
name = "huurklaar-notifier"
dynamic = ["version"]
description = "Huurklaar Meldingen: menubalk- en tray-app met meldingen bij taken en vereiste acties"
requires-python = ">=3.13"
dependencies = [
  # Sleutelopslag: Keychain (Mac) en Credential Manager (Windows) met dezelfde code.
  "keyring>=25",
]

[project.optional-dependencies]
mac = [
  "rumps>=0.4",
  "pyobjc-framework-UserNotifications>=10",
  "pyobjc-framework-Cocoa>=10",
]
windows = [
  "pystray>=0.19.5",
  "pillow>=10.1",
  "win11toast>=0.36",
]
dev = ["pytest>=8", "ruff>=0.6", "pyinstaller>=6", "pillow>=10.1"]

[project.scripts]
huurklaar-notifier = "huurklaar_notifier.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "huurklaar_notifier._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]  # ook in een worktree de eigen code testen, niet een elders geïnstalleerde kopie

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# Lange commentaarregels laten we staan; de formatter bewaakt de code zelf.
ignore = ["E501"]
