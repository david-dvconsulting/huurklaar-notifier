# Bouwsteen voor Windows (KAN-120): bouwt .exe en setup.exe op een windows-latest-runner, met self-test voor en
# in de .exe. Publiceren, tags en de updatecheck horen bij KAN-121: die roept deze workflow aan (workflow_call).
name: Windows build

on:
  workflow_call:
    inputs:
      version:
        description: "Versie voor de exe en de installer (zonder v)"
        type: string
        required: false
        default: ""
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Unit tests
        run: |
          python -m pip install -e ".[windows,dev]"
          python -m pytest -q
      # Het script doet de self-test vóór het bouwen en in de gebouwde .exe's (met time-out) en bouwt de installer.
      - name: Build
        shell: pwsh
        run: scripts\build-windows.ps1 -Version "${{ inputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: huurklaar-meldingen-windows
          path: |
            dist/Huurklaar-Meldingen.exe
            dist/Huurklaar-Meldingen-Setup-*.exe
