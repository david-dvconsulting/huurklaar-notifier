# Houdt de vastgepinde releasebuilds bij (requirements/release-*.txt, met hashes); updates komen als PR door CI.
# Zie docs/building-and-releasing.md. De GitHub Actions in de workflows staan op SHA en worden hier niet beheerd.
version: 2
updates:
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      # Maandelijks: elke Dependabot-PR start CI en release-locks.yml op macOS en Windows.
      interval: monthly
    open-pull-requests-limit: 5
